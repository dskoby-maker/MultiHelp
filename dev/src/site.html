<style>
  :root{
    --bg:#ffffff; --ink:#0b0b0b; --muted:#6b6b6b; --hair:#e8e6e1; --soft:#f2f1ed; --glass:rgba(255,255,255,.92);
    --block:#0b0b0b; --on-block:#ffffff; --block-muted:#a3a3a3; --block-line:#2c2c2c;
    --ok:#1f8a4c; --warn:#b4540e;
    --ease:cubic-bezier(.2,.75,.2,1); --ease2:cubic-bezier(.77,0,.18,1);
    --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b0b0b; --ink:#f4f3ef; --muted:#9a9a9a; --hair:#262626; --soft:#181818; --glass:rgba(11,11,11,.9);
      --block:#1a1a1a; --on-block:#f4f3ef; --block-muted:#8a8a8a; --block-line:#333;
      --ok:#45c97a; --warn:#f0a35e;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:'Jost',system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
  a{color:inherit;text-decoration:none}
  img,video{display:block;width:100%;height:100%;object-fit:cover}
  svg{flex:0 0 auto}
  .caps{font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  .muted{color:var(--muted)}
  .press{transition:transform .18s var(--ease),opacity .18s}
  .press:active{transform:scale(.96)}

  /* ---------- shell ---------- */
  .stage{height:100%;display:flex;align-items:center;justify-content:center;gap:64px}
  .app{position:relative;width:100%;height:100dvh;overflow:hidden;overflow:clip;background:var(--bg)}
  .side{display:none}
  @media (min-width:760px){
    body{background:#e9e8e4}
    .app{width:390px;height:min(844px,calc(100vh - 48px));border-radius:44px;box-shadow:0 0 0 10px #0b0b0b,0 40px 80px rgba(0,0,0,.25)}
    .side{display:flex;flex-direction:column;gap:18px;max-width:340px;color:#0b0b0b}
    .side h1{margin:0;font-weight:300;font-size:64px;line-height:.9;letter-spacing:-.04em;text-transform:uppercase}
    .side p{margin:0;color:#444;line-height:1.6}
    .side a{text-decoration:underline;text-underline-offset:4px}
  }
  @media (min-width:760px) and (prefers-color-scheme: dark){ body{background:#161616} .side{color:#f4f3ef} .side p{color:#aaa} .app{box-shadow:0 0 0 10px #2a2a2a,0 40px 80px rgba(0,0,0,.6)} }

  .screens{position:absolute;inset:0 0 calc(64px + var(--safe-b)) 0}
  .screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .35s ease,transform .45s var(--ease);scrollbar-width:none}
  .screen::-webkit-scrollbar{display:none}
  .screen.active{opacity:1;transform:none;pointer-events:auto}

  .topbar{position:sticky;top:0;z-index:5;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + var(--safe-t)) 18px 10px;transition:box-shadow .3s}
  .topbar.shadow{box-shadow:0 1px 0 var(--hair)}
  .brand{font-weight:500;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
  .brand i{font-style:normal;color:var(--muted);font-weight:400}
  .demo{font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--muted);color:var(--muted);border-radius:6px;padding:2px 6px;font-weight:500}
  .city{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:1px solid var(--ink);border-radius:999px;font-size:13px;white-space:nowrap}

  /* ---------- home ---------- */
  .hello{padding:14px 18px 0}
  .hello h1{margin:0;font-weight:300;font-size:44px;line-height:.95;letter-spacing:-.03em;text-transform:uppercase}
  .hello h1 .l{display:block;overflow:hidden}
  .hello h1 .l span{display:block;transform:translateY(105%);animation:up .9s var(--ease) .75s forwards}
  .hello h1 .l:nth-child(2) span{animation-delay:.83s}
  @keyframes up{to{transform:none}}
  .fake-search{margin:18px 18px 0;display:flex;align-items:center;gap:12px;width:calc(100% - 36px);min-height:54px;padding:0 16px;background:var(--soft);border-radius:16px;color:var(--muted);font-size:15px;text-align:left}
  .quick{display:flex;gap:8px;overflow-x:auto;padding:12px 18px 0;scrollbar-width:none}
  .quick::-webkit-scrollbar{display:none}
  .sec-t{display:flex;justify-content:space-between;align-items:baseline;padding:30px 18px 12px}
  .sec-t h2{margin:0;font-weight:500;font-size:18px;letter-spacing:-.01em}
  .sec-t button{font-size:13px;color:var(--muted);min-height:32px}

  .hscroll{display:flex;gap:10px;overflow-x:auto;padding:0 18px;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-padding:0 18px}
  .hscroll::-webkit-scrollbar{display:none}
  .hscroll > *{scroll-snap-align:start;flex:0 0 auto}

  .cat{width:104px;display:flex;flex-direction:column;gap:8px;text-align:left}
  .cat .im{height:132px;border-radius:18px;overflow:hidden;background:var(--soft)}
  .cat .im img{filter:grayscale(1);transition:filter .4s}
  .cat:active .im img{filter:none}
  .cat span{font-size:12px;line-height:1.2}

  .card{width:240px;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer}
  .card .im{position:relative;height:300px;border-radius:22px;overflow:hidden;background:var(--soft)}
  .card .im::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(to top,rgba(0,0,0,.55),transparent);pointer-events:none}
  .card .im img{transition:transform .6s var(--ease)}
  .card:active .im img{transform:scale(1.04)}
  .card .ava{position:absolute;left:12px;bottom:12px;z-index:2;display:flex;align-items:center;gap:8px;color:#fff;font-size:13px;font-weight:500}
  .ava-i{width:34px;height:34px;border-radius:50%;overflow:hidden;border:2px solid #fff;background:#d9d7d1;color:#0b0b0b;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex:0 0 auto}
  .noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:300;font-size:64px;letter-spacing:-.04em;color:var(--muted);background:var(--soft)}
  .pill{position:absolute;left:12px;top:12px;z-index:2;display:flex;align-items:center;gap:6px;background:#fff;color:#0b0b0b;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:500}
  .vid-pill{position:absolute;right:58px;top:12px;z-index:2;display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:6px 10px;font-size:11px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;flex:0 0 auto}
  .pill .dot{background:#1f8a4c}
  .heart{position:absolute;right:10px;top:10px;z-index:2;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center}
  .heart svg path{stroke:#0b0b0b}
  .heart.on svg path{fill:#0b0b0b}
  .pop{animation:pop .45s var(--ease)}
  @keyframes pop{40%{transform:scale(1.3)}}
  .card .t{display:flex;justify-content:space-between;gap:8px;font-weight:500;font-size:15px}
  .card .s{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:-6px}
  .star{display:inline-flex;align-items:center;gap:3px;color:var(--ink);font-weight:500}

  .promo{margin:30px 18px 0;background:var(--block);color:var(--on-block);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:10px;text-align:left;width:calc(100% - 36px);position:relative;overflow:hidden}
  .promo b{font-weight:300;font-size:30px;line-height:1;text-transform:uppercase;letter-spacing:-.02em;position:relative}
  .promo span{color:var(--block-muted);font-size:14px;position:relative}
  .promo .big{position:absolute;right:-6px;bottom:-28px;font-weight:300;font-size:120px;letter-spacing:-.06em;color:var(--block-line)}

  .list{display:flex;flex-direction:column;padding:0 18px 24px}
  .row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--hair);text-align:left;width:100%;opacity:0;transform:translateY(12px);animation:rowin .5s var(--ease) forwards}
  @keyframes rowin{to{opacity:1;transform:none}}
  .row .th{position:relative;width:64px;height:64px;border-radius:16px;overflow:hidden;flex:0 0 auto;background:var(--soft)}
  .row .th .noimg{font-size:22px}
  .row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .row .tx b{font-weight:500;font-size:15px;display:flex;align-items:center;gap:6px}
  .row .tx span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
  .row .pr{font-size:14px;font-weight:500;white-space:nowrap;text-align:right}

  .skel{background:linear-gradient(90deg,var(--soft) 0%,var(--hair) 50%,var(--soft) 100%);background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}
  .skel-card{width:240px;height:340px;border-radius:22px}
  .skel-row{height:64px;border-radius:16px;margin:12px 0}

  /* ---------- search ---------- */
  .search-bar{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px;margin:0 18px;background:var(--soft);border-radius:16px}
  .search-bar input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:var(--ink)}
  .search-bar input::-webkit-search-cancel-button{display:none}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 18px 0;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips + .chips{padding-top:8px;padding-bottom:6px}
  .chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--hair);font-size:13px;transition:background .25s,color .25s,border-color .25s}
  .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .chip.on .dot{background:var(--bg)}
  .empty{padding:50px 30px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;color:var(--muted)}
  .empty b{color:var(--ink);font-weight:300;font-size:28px;text-transform:uppercase;letter-spacing:-.02em;line-height:1.05}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 22px;border-radius:16px;font-weight:500;font-size:15px;white-space:nowrap}
  .btn.dark{background:var(--ink);color:var(--bg)}
  .btn.line{border:1px solid var(--ink)}
  .btn.full{width:100%}

  /* ---------- for pros ---------- */
  .hero-pro{margin:8px 18px 0;background:var(--block);color:var(--on-block);border-radius:28px;padding:26px 22px;display:flex;flex-direction:column;gap:16px}
  .hero-pro h2{margin:0;font-weight:300;font-size:34px;line-height:1;text-transform:uppercase;letter-spacing:-.02em}
  .hero-pro .price{display:flex;align-items:baseline;gap:10px;border-top:1px solid var(--block-line);padding-top:14px}
  .hero-pro .price b{font-weight:300;font-size:72px;line-height:.85;letter-spacing:-.05em}
  .hero-pro .btn{background:var(--on-block);color:var(--block)}
  .steps{padding:0 18px;display:flex;flex-direction:column}
  .step{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--hair)}
  .step .n{font-weight:300;font-size:30px;line-height:1;width:40px;flex:0 0 auto}
  .step b{font-weight:500;display:block;margin-bottom:4px}
  .step span{font-size:14px;color:var(--muted);line-height:1.5}
  .menu-list{padding:0 18px 30px}
  .menu-list button,.menu-list a{width:100%;display:flex;justify-content:space-between;align-items:center;min-height:56px;border-bottom:1px solid var(--hair);font-size:15px;text-align:left}

  /* ---------- detail ---------- */
  .dimmer{position:absolute;inset:0;z-index:19;background:#000;opacity:0;pointer-events:none;transition:opacity .5s}
  .dimmer.on{opacity:.3}
  .detail{position:absolute;inset:0;z-index:20;background:var(--bg);transform:translateX(100%);visibility:hidden;transition:transform .5s var(--ease2),visibility 0s linear .5s;display:flex;flex-direction:column}
  .detail.open{transform:none;visibility:visible;transition:transform .5s var(--ease2),visibility 0s}
  .detail.drag{transition:none}
  .d-head{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(10px + var(--safe-t)) 12px 10px;transition:background .3s,box-shadow .3s}
  .d-head .ttl{flex:1;min-width:0;font-weight:500;font-size:16px;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s var(--ease);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .d-head.solid{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 1px 0 var(--hair)}
  .d-head.solid .ttl{opacity:1;transform:none}
  .circ{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;transition:background .3s}
  .circ svg path{stroke:#0b0b0b}
  .d-head.solid .circ{background:transparent}
  .d-head.solid .circ svg path{stroke:var(--ink)}
  .d-head .circ.heart{position:static}
  .d-head .circ.heart.on svg path{fill:#0b0b0b}
  .d-head.solid .circ.heart.on svg path{fill:var(--ink)}

  .d-scroll{flex:1;overflow-y:auto;scrollbar-width:none}
  .d-scroll::-webkit-scrollbar{display:none}
  .gallery{position:relative;height:480px;background:#111;overflow:hidden}
  .g-track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
  .g-track::-webkit-scrollbar{display:none}
  .g-track > button{position:relative;flex:0 0 100%;height:100%;scroll-snap-align:start}
  .gallery::after{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(to top,rgba(0,0,0,.7),transparent);pointer-events:none}
  .g-info{position:absolute;left:18px;right:18px;bottom:40px;z-index:2;color:#fff;pointer-events:none}
  .g-info .who{display:flex;align-items:center;gap:12px}
  .g-info .ava-i{width:48px;height:48px;font-size:16px}
  .g-info h2{margin:0;font-weight:300;font-size:36px;line-height:1;text-transform:uppercase;letter-spacing:-.02em}
  .g-info .r{margin-top:6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
  .dots{position:absolute;right:18px;bottom:44px;z-index:3;display:flex;gap:5px}
  .dots i{width:6px;height:6px;border-radius:999px;background:rgba(255,255,255,.5);transition:width .35s var(--ease),background .35s}
  .dots i.on{width:20px;background:#fff}
  .g-empty{height:100%;display:flex;align-items:center;justify-content:center;color:#777;font-size:13px}
  .g-vtag{position:absolute;left:16px;top:70px;z-index:2;display:flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;pointer-events:none}
  .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:1}
  .play span{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}

  .d-body{position:relative;margin-top:-22px;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 18px 30px;display:flex;flex-direction:column;gap:20px}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);border:1px solid var(--hair);border-radius:18px}
  .stats div{padding:14px 10px;text-align:center;display:flex;flex-direction:column;gap:2px}
  .stats div + div{border-left:1px solid var(--hair)}
  .stats b{font-weight:500;font-size:18px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
  .stats span{font-size:11px;color:var(--muted)}
  .newbie{border:1px solid var(--hair);border-radius:18px;padding:14px 16px;font-size:14px;display:flex;gap:10px;align-items:center}
  .avail{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500}
  .avail .dot{width:9px;height:9px;box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 20%,transparent);animation:pulse 2s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--ok) 0%,transparent)}}
  .facts{display:flex;flex-direction:column;gap:12px}
  .facts div{display:flex;align-items:center;gap:12px;font-size:14px}
  .facts svg{width:20px;height:20px}
  .about{margin:0;font-size:15px;line-height:1.6;opacity:.85;white-space:pre-line}
  .about.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .more{align-self:flex-start;font-size:13px;font-weight:500;text-decoration:underline;text-underline-offset:4px;margin-top:-12px;min-height:32px}
  .h3{display:flex;justify-content:space-between;align-items:baseline}
  .h3 b{font-weight:500;font-size:18px}
  .h3 span{font-size:13px;color:var(--muted)}
  .pf-tabs{display:flex;gap:18px;margin-top:-6px}
  .pf-tabs button{font-size:13px;color:var(--muted);min-height:36px;border-bottom:1px solid transparent}
  .pf-tabs button.on{color:var(--ink);border-color:var(--ink)}
  .pf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;margin:0 -18px}
  .pf > *{position:relative;aspect-ratio:1;overflow:hidden;background:var(--soft)}
  .pf > .hide{display:none}
  .pf img{transition:transform .5s var(--ease)}
  .pf > *:active img{transform:scale(1.05)}
  .ext{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--block)!important;color:var(--on-block);font-size:11px;text-align:center;padding:8px}
  .ext .mono{border-color:var(--on-block)}
  .mono{width:36px;height:36px;border-radius:50%;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;letter-spacing:.02em;flex:0 0 auto}
  .socials{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
  .socials::-webkit-scrollbar{display:none}
  .soc{flex:0 0 auto;display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px 0 8px;border:1px solid var(--hair);border-radius:999px;font-size:14px}
  .soc small{display:block;font-size:11px;color:var(--muted)}
  .svc{border-top:1px solid var(--ink)}
  .svc button{width:100%;display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--hair);text-align:left;font-size:15px}
  .svc button span:first-child{flex:1}
  .svc .go{width:30px;height:30px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .svc-note{font-size:12px;color:var(--muted);margin-top:-10px}
  .rv-sum{display:flex;align-items:center;gap:16px}
  .rv-sum b{font-weight:300;font-size:48px;line-height:1;letter-spacing:-.03em}
  .stars{display:inline-flex;gap:2px}
  .rv{background:var(--soft);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
  .rv .top{display:flex;justify-content:space-between;align-items:center;font-size:13px}
  .rv .top b{font-weight:500;font-size:14px}
  .rv p{margin:0;font-size:14px;line-height:1.55;opacity:.85}
  .rv .svcn{font-size:12px;color:var(--muted)}
  .report{align-self:center;font-size:12px;color:var(--muted);min-height:40px}

  .d-cta{display:flex;gap:10px;align-items:center;padding:12px 18px calc(14px + var(--safe-b));border-top:1px solid var(--hair);background:var(--bg)}
  .round{width:54px;height:54px;border-radius:50%;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .d-cta .btn.dark{flex:1}

  /* ---------- lightbox ---------- */
  .lb{position:absolute;inset:0;z-index:45;background:#000;display:flex;flex-direction:column;opacity:0;pointer-events:none;visibility:hidden;transition:opacity .3s,visibility 0s linear .3s}
  .lb.on{opacity:1;pointer-events:auto;visibility:visible;transition:opacity .3s,visibility 0s}
  .lb-top{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + var(--safe-t)) 14px 0;color:#fff}
  .lb-top button{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
  .lb-track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;transition:transform .3s var(--ease)}
  .lb-track::-webkit-scrollbar{display:none}
  .lb-track > div{flex:0 0 100%;scroll-snap-align:start;display:flex;align-items:center;justify-content:center}
  .lb-track img,.lb-track video{height:auto;max-height:100%;object-fit:contain;background:#000}
  .lb-track iframe{width:100%;aspect-ratio:16/9;border:0;max-height:100%}
  .lb-track iframe.tall{aspect-ratio:9/16;height:80%;width:auto;max-width:100%}
  .lb-cap{position:absolute;left:0;right:0;bottom:calc(20px + var(--safe-b));text-align:center;color:#aaa;font-size:12px;pointer-events:none}

  /* ---------- tabbar ---------- */
  .tabbar{position:absolute;left:0;right:0;bottom:0;z-index:10;height:calc(64px + var(--safe-b));padding-bottom:var(--safe-b);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--hair);display:grid;grid-template-columns:repeat(5,1fr)}
  .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;letter-spacing:.06em;color:var(--muted);transition:color .3s;position:relative}
  .tab.on{color:var(--ink)}
  .tab svg{transition:transform .35s var(--ease)}
  .tab.on svg{transform:translateY(-2px)}
  .tab .cnt{position:absolute;top:8px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:10px;display:none;align-items:center;justify-content:center;padding:0 4px;letter-spacing:0}
  .tab .cnt.show{display:flex}
  .ind{position:absolute;top:-1px;left:0;height:2px;width:20%;background:var(--ink);transition:transform .45s var(--ease)}

  /* ---------- sheets / toast / splash ---------- */
  .sheet-bg{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,0);pointer-events:none;transition:background .35s}
  .sheet-bg.on{background:rgba(0,0,0,.4);pointer-events:auto}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 18px calc(20px + var(--safe-b));transform:translateY(100%);transition:transform .45s var(--ease);max-height:80%;overflow-y:auto}
  .sheet-bg.on .sheet{transform:none}
  .grab{width:40px;height:4px;border-radius:9px;background:var(--hair);margin:0 auto 14px}
  .sheet h3{margin:0 0 6px;font-weight:300;font-size:26px;text-transform:uppercase;letter-spacing:-.02em}
  .sheet button.opt{width:100%;display:flex;justify-content:space-between;align-items:center;min-height:54px;border-bottom:1px solid var(--hair);font-size:16px}
  .toast{position:absolute;left:50%;bottom:calc(84px + var(--safe-b));z-index:60;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:12px 18px;font-size:13px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;transition:all .35s var(--ease);pointer-events:none}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .splash{position:absolute;inset:0;z-index:70;background:#0b0b0b;color:#fff;display:flex;align-items:center;justify-content:center;transition:transform .8s var(--ease2) .2s}
  .splash.go{transform:translateY(-100%)}
  .splash b{font-weight:300;font-size:46px;letter-spacing:-.03em;text-transform:uppercase;overflow:hidden;display:block}
  .splash b span{display:block;transform:translateY(100%);animation:up .8s var(--ease) .1s forwards}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }

  /* ---------- кабинет ---------- */
  [hidden]{display:none!important}
  .cab-link{font-size:13px;color:var(--block-muted);text-decoration:underline;text-underline-offset:3px;min-height:36px;align-self:center}
  .cab-head{margin:8px 18px 0;padding:20px 22px;border-radius:24px;background:var(--block);color:var(--on-block);display:flex;flex-direction:column;gap:6px}
  .cab-head .em{font-size:16px;word-break:break-all}
  .cab-head button{align-self:flex-start;font-size:13px;color:var(--block-muted);text-decoration:underline;text-underline-offset:3px;min-height:32px}
  .cab-new{margin:14px 18px 0;width:calc(100% - 36px)}
  .cab-empty{margin:0 18px;color:var(--muted);font-size:14px;line-height:1.5}
  .my{margin:0 18px 10px;border:1px solid var(--hair);border-radius:20px;overflow:hidden}
  .my .top{display:flex;gap:12px;align-items:center;padding:14px}
  .my .av{width:56px;height:56px;border-radius:14px;overflow:hidden;background:var(--soft);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px}
  .my .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .my .tx b{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .my .tx > span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .my .tx .st{align-self:flex-start;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid currentColor;margin-top:2px}
  .st.on{color:var(--ok)!important} .st.off{color:var(--muted)} .st.bad{color:var(--warn)!important}
  .my .acts{display:grid;border-top:1px solid var(--hair)}
  .my .acts button{min-height:46px;font-size:13px;border-right:1px solid var(--hair)}
  .my .acts button:last-child{border-right:0}
  .auth-p{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.45}
  .auth-or{text-align:center;color:var(--muted);font-size:13px;margin:14px 0}
  .sheet .cab-link{display:block;margin:10px auto 0;color:var(--muted)}
  .fld{display:flex;flex-direction:column;gap:6px;margin:0 0 14px;min-width:0}
  .fld > span{font-size:13px;color:var(--muted)}
  .fld input,.fld textarea,.fld select{width:100%;min-height:50px;padding:12px 14px;border:1px solid var(--hair);border-radius:14px;background:var(--soft);font:inherit;font-size:16px;color:var(--ink);outline:0;-webkit-appearance:none;appearance:none}
  .fld textarea{resize:vertical;line-height:1.45}
  .fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--ink)}
  .fld small{font-size:12px;color:var(--muted);line-height:1.4}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chk{display:flex;gap:12px;align-items:flex-start;padding:8px 0;font-size:15px;line-height:1.35;cursor:pointer}
  .chk input{width:22px;height:22px;margin:0;flex:0 0 auto;accent-color:var(--ink)}
  .ed{z-index:30}
  .ed-head{display:flex;align-items:center;gap:8px;padding:calc(8px + var(--safe-t)) 12px 8px 6px;border-bottom:1px solid var(--hair);background:var(--bg)}
  .ed-head b{flex:1;min-width:0;font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ed-head .btn{min-height:42px;padding:0 16px;border-radius:12px;font-size:14px}
  .ed-back{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
  .ed-body{flex:1;overflow-y:auto;padding:18px 18px calc(40px + var(--safe-b));scrollbar-width:none}
  .ava-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .ava-row .av{width:72px;height:72px;border-radius:50%;overflow:hidden;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--muted)}
  .ava-row .btn{min-height:44px;padding:0 16px;border-radius:12px;font-size:14px;cursor:pointer}
  .ava-row .cab-link{color:var(--muted)}
  .ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .ph-grid > *{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--soft)}
  .ph-grid .x{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:18px;line-height:30px;text-align:center}
  .ph-load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px}
  .ph-add{display:flex;align-items:center;justify-content:center;border:1px dashed var(--muted);color:var(--muted);font-size:14px;cursor:pointer}

  /* ---------- чат ---------- */
  .d-cta .round.wa{border-color:var(--hair)}
  .d-cta{gap:8px}
  .d-cta .round{width:48px;height:48px}
  .d-cta .btn{min-width:0;padding:0 14px}
  .d-cta .btn span{overflow:hidden;text-overflow:ellipsis}
  .ch-row{width:100%;display:flex;gap:12px;align-items:center;padding:12px 18px;text-align:left;border-bottom:1px solid var(--hair)}
  .ch-row .av{width:52px;height:52px;border-radius:50%;overflow:hidden;background:var(--soft);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:17px}
  .ch-row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .ch-row .tx b{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch-row .tx span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .ch-row .meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:11px;color:var(--muted);flex:0 0 auto}
  .ch-row .meta i{width:10px;height:10px;border-radius:50%;background:var(--ok)}
  .chat .ed-head .ttl2{flex:1;min-width:0;display:flex;flex-direction:column;text-align:left}
  .chat .ed-head .ttl2 b{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chat .ed-head .ttl2 small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch-ico{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:0 0 auto}
  .msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px;background:var(--soft);scrollbar-width:none}
  .msg{max-width:80%;padding:8px 12px 6px;border-radius:18px;font-size:15px;line-height:1.4;display:flex;flex-direction:column;gap:4px;word-wrap:break-word;overflow-wrap:anywhere}
  .msg.l{align-self:flex-start;background:var(--bg);border-bottom-left-radius:6px}
  .msg.r{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:6px}
  .msg .mb{white-space:pre-wrap}
  .msg .mt{font-size:10px;opacity:.55;align-self:flex-end}
  .msg .mph{display:block;width:220px;max-width:100%;border-radius:12px;overflow:hidden;margin:2px -4px 0}
  .msg .mph img{height:auto;max-height:280px}
  .ch-day{align-self:center;font-size:11px;color:var(--muted);padding:8px 0 2px}
  .ch-hint{align-self:center;max-width:300px;text-align:center;font-size:13px;color:var(--muted);line-height:1.5;padding:30px 10px}
  .ch-bar{display:flex;align-items:flex-end;gap:8px;padding:8px 10px calc(8px + var(--safe-b));border-top:1px solid var(--hair);background:var(--bg)}
  .ch-bar textarea{flex:1;min-width:0;resize:none;border:1px solid var(--hair);border-radius:20px;background:var(--soft);padding:10px 14px;font:inherit;font-size:16px;line-height:1.35;color:var(--ink);outline:0;max-height:120px}
  .ch-bar .ch-ico{height:44px;cursor:pointer}
  .ch-send{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .safe-list{margin:0 0 18px;padding:0 0 0 20px;font-size:14px;line-height:1.6}
  .cab-msgs{margin:10px 18px 0;width:calc(100% - 36px);display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:0 18px;border:1px solid var(--hair);border-radius:16px;font-size:15px}
  .cab-msgs b{background:var(--ok);color:#fff;border-radius:999px;font-size:12px;padding:2px 8px;font-weight:500}
  .push-card{position:relative;margin:12px 18px 4px;padding:16px 44px 16px 16px;border-radius:20px;background:var(--soft);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
  .push-card b{font-weight:500;font-size:15px}
  .push-card span{font-size:13px;color:var(--muted);line-height:1.45}
  .push-card .btn{min-height:42px;padding:0 18px;border-radius:12px;font-size:14px;margin-top:4px}
  .push-card .x{position:absolute;top:8px;right:8px;width:32px;height:32px;font-size:20px;color:var(--muted)}
  .inst-ico{width:72px;height:72px;border-radius:18px;overflow:hidden;margin:6px 0 14px}

  /* ---------- версия для компьютера (широкий экран); телефон не меняется ---------- */
  .tb-brand{display:none}
  @media (min-width:1024px){
    body,#mh-root{background:var(--bg)}
    .stage{gap:0;display:block}
    .side{display:none!important}
    .app{width:100%!important;height:100dvh!important;border-radius:0!important;box-shadow:none!important}
    /* меню сверху */
    .tabbar{top:0;bottom:auto;height:68px;padding:0 max(32px,calc((100% - 1240px) / 2));display:flex;align-items:center;justify-content:flex-end;gap:4px;border-top:0;border-bottom:1px solid var(--hair)}
    .tb-brand{display:flex;align-items:center;margin-right:auto;font-weight:500;font-size:20px;letter-spacing:-.01em;cursor:pointer}
    .tb-brand i{font-style:normal;color:var(--muted);font-weight:400}
    .tab{flex-direction:row;gap:8px;height:44px;padding:0 16px;border-radius:999px;font-size:14px;letter-spacing:0;color:var(--muted)}
    .tab svg{width:19px;height:19px}
    .tab:hover{background:var(--soft);color:var(--ink)}
    .tab.on{background:var(--ink);color:var(--bg)}
    .tab.on svg{transform:none}
    .tab .cnt{position:static;margin-left:2px}
    .tab.on .cnt{background:var(--bg);color:var(--ink)}
    .ind{display:none}
    .screens{inset:68px 0 0 0}
    .screen{padding:0 max(32px,calc((100% - 1240px) / 2)) 40px}
    #s-me,#s-chats,#s-fav{padding-left:max(32px,calc((100% - 760px) / 2));padding-right:max(32px,calc((100% - 760px) / 2))}
    .topbar{padding-left:0;padding-right:0}
    #s-home .topbar .brand{visibility:hidden}
    .screen .topbar .brand{font-size:26px;font-weight:400}
    /* главная */
    .hello{padding:20px 0 0}
    .hello h1{font-size:88px}
    .fake-search{margin:26px 0 0;width:100%;max-width:640px;min-height:60px;font-size:16px}
    .quick,.chips{padding-left:0;padding-right:0}
    .sec-t{padding:40px 0 16px}
    .sec-t h2{font-size:22px}
    .hscroll{padding:0;overflow:visible}
    #homeCats{flex-wrap:wrap;gap:14px}
    .cat{width:150px}
    .cat .im{height:180px}
    .cat:hover .im img{filter:none}
    #nearby{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
    #nearby .card,#nearby .skel-card{width:auto}
    .card .im{height:320px}
    .card:hover .im img{transform:scale(1.04)}
    .promo{margin:44px 0 0;width:100%;padding:32px}
    .promo b{font-size:40px}
    .list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:40px;padding:0 0 30px}
    #s-fav .list{grid-template-columns:1fr}
    .row{border-radius:12px}
    .row:hover{background:var(--soft)}
    .search-bar{margin:0;min-height:58px}
    /* кабинет, чаты */
    .hero-pro,.cab-head{margin-left:0;margin-right:0}
    .steps,.menu-list{padding-left:0;padding-right:0}
    .cab-new,.cab-msgs{margin-left:0;margin-right:0;width:100%}
    .my,.cab-empty,.push-card{margin-left:0;margin-right:0}
    .ch-row{padding-left:12px;padding-right:12px;border-radius:12px}
    .ch-row:hover{background:var(--soft)}
    /* карточка мастера, чат, редактор — панель справа */
    .detail{left:auto;right:0;width:560px;box-shadow:-24px 0 60px rgba(0,0,0,.14)}
    .ed{width:620px}
    .chat{width:520px}
    .gallery{height:520px}
    .d-cta{padding-bottom:16px}
    /* окна — по центру */
    .sheet{left:50%;right:auto;top:50%;bottom:auto;width:460px;max-height:86%;border-radius:26px;padding:26px 28px 28px;opacity:0;transform:translate(-50%,-46%);transition:transform .35s var(--ease),opacity .25s}
    .sheet-bg.on .sheet{transform:translate(-50%,-50%);opacity:1}
    .sheet .grab{display:none}
    .toast{bottom:28px}
    .btn,.chip,.city,.opt,.press{cursor:pointer}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="side">
    <span class="caps" style="opacity:.6">multihelp.es</span>
    <h1 data-i18n="side_h">Откройте на телефоне</h1>
    <p data-i18n="side_p1"></p>
    <p data-i18n-html="side_p2"></p>
  </div>

  <div class="app" id="app">
    <div class="splash" id="splash"><b><span>MultiHelp</span></b></div>

    <div class="screens">
      <!-- HOME -->
      <section class="screen active" data-tab="home" id="s-home">
        <div class="topbar">
          <div class="brand">MultiHelp<i>.es</i><span class="demo" id="demoBadge" hidden data-i18n="demo">демо</span></div>
          <div style="display:flex;gap:8px;align-items:center"><button class="city press" data-open-lang data-i18n-aria="language" aria-label="Idioma" style="padding:0 12px"><span class="lang-code">ES</span></button>
          <button class="city press" data-open-city data-i18n-aria="choose_city" aria-label="Выбрать город">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
            <span class="city-name">Вся Испания</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button></div>
        </div>
        <div class="hello"><h1><span class="l"><span data-i18n="hello1">Кто нужен</span></span><span class="l"><span data-i18n="hello2">сегодня?</span></span></h1></div>
        <button class="fake-search press" data-go-search>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <span id="typing"></span>
        </button>
        <div class="quick">
          <button class="chip press" data-quick="today"><span class="dot"></span><span data-i18n="q_today">Свободны сегодня</span></button>
          <button class="chip press" data-quick="urgent" data-i18n="q_urgent">Срочный выезд</button>
          <button class="chip press" data-quick="video" data-i18n="q_video">Есть видео</button>
        </div>

        <div class="sec-t"><h2 data-i18n="categories">Категории</h2></div>
        <div class="hscroll" id="homeCats"></div>

        <div class="sec-t"><h2 data-i18n="near">Рядом с вами</h2><button data-go-search data-i18n="see_all">Все →</button></div>
        <div class="hscroll" id="nearby"></div>

        <button class="promo press" data-tab-go="me">
          <span class="big" aria-hidden="true">0€</span>
          <span class="caps" data-i18n="for_pros">Для специалистов</span>
          <b data-i18n-html="promo_b">Вы мастер?<br>Клиенты найдут вас</b>
          <span data-i18n="promo_s">Размещение бесплатно на время запуска →</span>
        </button>

        <div class="sec-t"><h2 data-i18n="new_pros">Новые специалисты</h2></div>
        <div class="list" id="newList"></div>
      </section>

      <!-- SEARCH -->
      <section class="screen" data-tab="search" id="s-search">
        <div class="topbar" style="flex-direction:column;align-items:stretch;gap:0;padding-left:0;padding-right:0">
          <label class="search-bar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input id="q" type="search" placeholder="Что нужно сделать?" data-i18n-ph="q_ph" data-i18n-aria="search" autocomplete="off" aria-label="Поиск">
            <button id="clearQ" data-i18n-aria="clear" aria-label="Очистить" style="display:none;width:32px;height:32px;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          </label>
          <div class="chips" id="chips"></div>
          <div class="chips" id="flags"></div>
        </div>
        <div class="sec-t" style="padding-top:14px"><h2 id="resCount" data-i18n="pros">Специалисты</h2><button data-open-city><span class="city-name">Вся Испания</span> ▾</button></div>
        <div class="list" id="results"></div>
      </section>

      <!-- FAVS -->
      <section class="screen" data-tab="fav" id="s-fav">
        <div class="topbar"><div class="brand" data-i18n="favs">Избранное</div></div>
        <div class="list" id="favList"></div>
      </section>

      <!-- FOR PROS -->
      <section class="screen" data-tab="chats" id="s-chats">
        <div class="topbar"><div class="brand" data-i18n="chats">Mensajes</div></div>
        <div id="chatList"></div>
      </section>

      <section class="screen" data-tab="me" id="s-me">
        <div class="topbar"><div class="brand" data-i18n="for_pros">Для специалистов</div></div>
        <div id="formBox">
        <div class="hero-pro">
          <span class="caps" style="color:var(--block-muted)" data-i18n="your_page"></span>
          <h2 data-i18n="clients_find"></h2>
          <div class="price"><b>0€</b><span class="caps" data-i18n="during_launch"></span></div>
          <span style="color:var(--block-muted);font-size:14px" data-i18n="free_text"></span>
          <a class="btn press" href="#" data-form data-i18n="fill_form"></a>
        </div>
        <div class="sec-t"><h2 data-i18n="how"></h2></div>
        <div class="steps">
          <div class="step"><span class="n">01</span><div><b data-i18n="s1b"></b><span data-i18n="s1s"></span></div></div>
          <div class="step"><span class="n">02</span><div><b data-i18n="s2b"></b><span data-i18n="s2s"></span></div></div>
          <div class="step"><span class="n">03</span><div><b data-i18n="s3b"></b><span data-i18n="s3s"></span></div></div>
        </div>
        <div class="sec-t"><h2 data-i18n="already"></h2></div>
        <div class="menu-list" style="padding-bottom:0">
          <a class="press" href="#" data-contact="edit"><span data-i18n="edit_profile"></span> <span>→</span></a>
          <a class="press" href="#" data-contact="hide"><span data-i18n="hide_profile"></span> <span>→</span></a>
        </div>
        </div>
        <div id="cabBox" hidden></div>
        <div class="menu-list">
          <a class="press" href="#" data-install><span data-i18n="install_app"></span> <span>↓</span></a>
          <a class="press" href="#" data-contact="help"><span data-i18n="contact_us"></span> <span>→</span></a>
          <a class="press" href="#" data-open-lang><span data-i18n="language"></span> <span class="lang-code" style="font-weight:500">ES</span></a>
        </div>
      </section>
    </div>

    <!-- DETAIL -->
    <div class="dimmer" id="dimmer"></div>
    <section class="detail" id="detail" aria-hidden="true">
      <div class="d-head" id="dHead">
        <button class="circ press" id="back" data-i18n-aria="back" aria-label="Назад"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="ttl" id="dTitle"></div>
        <button class="circ press" id="share" data-i18n-aria="share" aria-label="Поделиться"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v13M7 8l5-5 5 5M5 14v6h14v-6"/></svg></button>
        <button class="circ press heart" id="dHeart" data-i18n-aria="fav_add" aria-label="В избранное"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/></svg></button>
      </div>
      <div class="d-scroll" id="dScroll">
        <div class="gallery">
          <div class="g-track" id="gTrack"></div>
          <div class="g-info" id="gInfo"></div>
          <div class="dots" id="dots"></div>
        </div>
        <div class="d-body" id="dBody"></div>
      </div>
      <div class="d-cta">
        <button class="round press" id="callBtn" data-i18n-aria="call" aria-label="Позвонить"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2"/></svg></button>
        <button class="round wa press" id="tgRound" hidden aria-label="Telegram"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4L3 11l6 2.5M21 4l-3 16-9-6.5M21 4L9 13.5V19l3-3.5"/></svg></button>
        <button class="round wa press" id="waRound" hidden aria-label="WhatsApp"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 20.5l1.3-4.2A8.5 8.5 0 1112 20.5a8.4 8.4 0 01-4.3-1.2z"/><path d="M9 9.5c0 2.5 2 5 5 5.5l1-1.3-1.6-1-.9.7c-.9-.4-1.6-1.1-2-2l.7-.9-1-1.6z"/></svg></button>
        <button class="btn dark press" id="chatBtn" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span data-i18n="chat_btn"></span></button>
        <button class="btn dark press" id="waBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 20.5l1.3-4.2A8.5 8.5 0 1112 20.5a8.4 8.4 0 01-4.3-1.2z"/><path d="M9 9.5c0 2.5 2 5 5 5.5l1-1.3-1.6-1-.9.7c-.9-.4-1.6-1.1-2-2l.7-.9-1-1.6z"/></svg>
          <span data-i18n="write_wa">Написать в WhatsApp</span>
        </button>
      </div>
    </section>

    <!-- LIGHTBOX -->
    <div class="lb" id="lb" role="dialog" data-i18n-aria="works" aria-label="Работы">
      <div class="lb-top"><span id="lbCount" style="font-size:13px"></span><button id="lbClose" data-i18n-aria="close" aria-label="Закрыть"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>
      <div class="lb-track" id="lbTrack"></div>
      <div class="lb-cap" data-i18n="lb_cap"></div>
    </div>

    <!-- TABBAR -->
    <nav class="tabbar" id="tabbar" data-i18n-aria="nav" aria-label="Навигация">
      <span class="ind" id="ind"></span>
      <span class="tb-brand" data-tab-go="home">MultiHelp<i>.es</i></span>
      <button class="tab on" data-tab-go="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg><span data-i18n="home">Главная</span></button>
      <button class="tab" data-tab-go="search"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span data-i18n="search">Поиск</span></button>
      <button class="tab" data-tab-go="fav"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/></svg><span data-i18n="favs">Избранное</span><span class="cnt" id="favCnt">0</span></button>
      <button class="tab" data-tab-go="chats"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span data-i18n="chats">Mensajes</span><span class="cnt" id="chatCnt">0</span></button>
      <button class="tab" data-tab-go="me"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span data-i18n="me_tab">Я мастер</span></button>
    </nav>

    <!-- SHEETS -->
    <div class="sheet-bg" id="sheetBg">
      <div class="sheet" role="dialog" data-i18n-aria="choose_city" aria-label="Выбор города">
        <div class="grab"></div>
        <h3 data-i18n="city">Город</h3>
        <div id="cityOpts"></div>
      </div>
    </div>
    <div class="sheet-bg" id="callBg">
      <div class="sheet" role="dialog" data-i18n-aria="call_sheet" aria-label="Звонок">
        <div class="grab"></div>
        <h3 id="callName" data-i18n="call">Позвонить</h3>
        <p class="muted" style="margin:0 0 16px;font-size:14px;line-height:1.5" data-i18n="call_hint"></p>
        <a class="btn dark press full" href="#" id="callNum" data-i18n="call">Позвонить</a>
        <button class="btn press full" style="margin-top:6px" data-close-sheet data-i18n="cancel">Отмена</button>
      </div>
    </div>

  async function fetchDb(){

  function fromDb(x){
    const media = [];
    (x.photos || []).forEach(u => { if (u) media.push({type:'photo', src:u, thumb:u}); });

    media.sort((a, b) => (a.type === 'ext') - (b.type === 'ext'));
    const svc = parseServices(x.services);
    return {
      id:String(x.id), self:true, n:x.name, r:x.profession, c:x.city || 'España', area:x.area || x.city, cat:CATS.some(c => c.id === x.category) ? x.category : catOf(x.category),

      langs:x.languages || '', from:+x.price_from || (svc.find(s => s[1]) || [0,0])[1], about:x.about || '', svc,
      social:String(x.social || '').split(/[\s,;]+/).map(normSocial).filter(Boolean).slice(0, 8), rev:[], wa:x.whatsapp || '', tg:x.telegram || '', phone:x.phone || ''

  function loadSDK(){
    if (sdkP) return sdkP;
    sdkP = new Promise((res, rej) => {
      const make = () => { sb = window.supabase.createClient(SB_URL, SB_KEY, {auth:{flowType:'pkce', persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storageKey:'mh_auth'}}); res(sb); };
      if (window.supabase && window.supabase.createClient) return make();
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';
      s.onload = make; s.onerror = () => { sdkP = null; rej(new Error('sdk')); };
      document.head.appendChild(s);
    });
    return sdkP;
  }
  function initAuth(){
    if (!HAS_SB) return Promise.resolve();
    if (!authP) authP = (async () => {
      await loadSDK();
      const {data} = await sb.auth.getSession();
      sb.auth.onAuthStateChange((ev, s) => setTimeout(() => setUser(s && s.user), 0));
      if (/[?&](code|error)=/.test(location.search)) {
        const u = new URL(location.href); ['code','error','error_code','error_description'].forEach(k => u.searchParams.delete(k));
        history.replaceState(null, '', u.pathname + u.search + u.hash);
      }
      await setUser(data.session && data.session.user);
    })().catch(e => { authP = null; toast(t('cab_err')); });
    return authP;
  }

  function storagePaths(x){
    const mark = '/object/public/photos/';

  async function cabAction(a, id, adm){
    if (a === 'login') return openAuth();
    await initAuth(); if (!sb) return;
    if (a === 'logout') { await removePush(); await sb.auth.signOut(); return; }
    if (a === 'new') { if (myList.length >= MAX_LISTINGS) return toast(t('ed_limit')); return openEd(null); }
    if (a === 'admin') return loadAll();
    const x = (adm ? (allList || []) : myList).find(i => String(i.id) === String(id)); if (!x) return;
    if (a === 'edit') return openEd(x);
    if (a === 'link') return shareLink(x);
    let res;
    if (a === 'toggle') res = await sb.from('listings').update({active:!x.active}).eq('id', x.id);
    else if (a === 'block') res = await sb.from('listings').update({blocked:!x.blocked}).eq('id', x.id);
    else if (a === 'del') {
      if (!confirm(t('del_q', {n:x.name}))) return;
      res = await sb.from('listings').delete().eq('id', x.id);
      if (!res.error) { const p = storagePaths(x); if (p.length) sb.storage.from('photos').remove(p).catch(() => {}); toast(t('deleted')); }
    } else return;
    if (res.error) return toast(t('cab_err'));
    await loadMine(); if (allList) await loadAll(); refreshDb();
  }

  function shrink(file, max){
    return new Promise((res, rej) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(b => b ? res(b) : rej(new Error('img')), 'image/jpeg', 0.82);
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
      img.src = url;
    });
  }

      .on('postgres_changes', {event:'INSERT', schema:'public', table:'messages'}, p => {

        else loadChatsSoon();

      .on('postgres_changes', {event:'*', schema:'public', table:'chats'}, loadChatsSoon)
      .subscribe();
    clearInterval(pollT);
    pollT = setInterval(async () => {
      if (!user || document.visibilityState !== 'visible') return;
      loadChats();

        const last = msgs.length ? msgs[msgs.length - 1].id : 0;
        const {data} = await sb.from('messages').select('*').eq('chat_id', openChat.id).gt('id', last).order('id', {ascending:true});

  function chatsOnLogout(){
    if (rtChan && sb) sb.removeChannel(rtChan); rtChan = null; clearInterval(pollT);
    chats = []; chatsLoaded = false; reports = null; closeChat(); renderChats(); updBadge();
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && user) loadChats(); });

  /* ---------- приложение на телефоне: установка и уведомления ---------- */
  const APP_URL = String(CFG.APP_URL || '');
  const IS_APP = (() => { try { const base = APP_URL.replace(/index\.html$/, ''); return !!base && location.origin + location.pathname.replace(/index\.html$/, '') === base; } catch(e){ return false; } })();
  const STANDALONE = (() => { try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch(e){ return false; } })();
  const IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const PUSH_OK = IS_APP && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && !!CFG.VAPID_PUBLIC;
  let installEvt = null, pushOn = false, openChatId = (() => { try { return new URLSearchParams(location.search).get('chat'); } catch(e){ return null; } })();

  if (IS_APP && 'serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
    navigator.serviceWorker.addEventListener('message', e => {
      if (e.data && e.data.type === 'open') { try { const id = new URL(e.data.url).searchParams.get('chat'); if (id) openChatById(id); } catch(err){} }
    });
  }
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; renderInstall(); });
  addEventListener('appinstalled', () => { installEvt = null; toast(t('install_done')); renderInstall(); });

  function renderInstall(){ $$('[data-install]').forEach(b => { b.hidden = STANDALONE; }); }
  function openInstall(){
    if (!IS_APP && APP_URL) { location.href = APP_URL + '?install=1'; return; }
    if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; }); return; }
    $('#instText').textContent = IOS ? t('install_ios') : t('install_other');
    $('#instBg').classList.add('on');
  }

  const b64u = s => { const p = '='.repeat((4 - s.length % 4) % 4); const r = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(r, c => c.charCodeAt(0)); };
  async function savePush(sub){ const j = sub.toJSON(); await sb.rpc('save_push', {p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth}); }
  async function checkPush(){
    pushOn = false;
    if (!PUSH_OK || !user || Notification.permission !== 'granted') return renderPushCards();
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (sub) { await savePush(sub); pushOn = true; }
    } catch(e){}
    renderPushCards();
  }
  async function enablePush(){
    if (!PUSH_OK) return openInstall();
    try {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') { toast(t('push_denied')); return renderPushCards(); }
      const reg = await navigator.serviceWorker.ready;
      const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64u(CFG.VAPID_PUBLIC)});
      await savePush(sub); pushOn = true; toast(t('push_on'));
    } catch(e) { toast(t('cab_err')); }
    renderPushCards();
  }
  async function removePush(){
    if (!PUSH_OK || !sb || !user) return;
    try { const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription(); if (sub) { await sb.rpc('delete_push', {p_endpoint:sub.endpoint}); await sub.unsubscribe(); } } catch(e){}
    pushOn = false;
  }
  function pushCardHTML(){
    if (!HAS_SB || !user || pushOn) return '';
    const hid = LS.get('mh_push_hide', 0); if (hid && Date.now() - hid < 3 * 864e5) return '';
    let p, btn, act;
    if (PUSH_OK) {
      if (Notification.permission === 'denied') return '';
      p = t('push_p'); btn = t('push_btn'); act = 'on';
    } else if (IS_APP && IOS && !STANDALONE) { p = t('push_ios_p'); btn = t('install_btn'); act = 'install'; }
    else if (!IS_APP && APP_URL) { p = t('push_app_p'); btn = t('install_btn'); act = 'install'; }
    else return '';
    return `<div class="push-card"><button class="x" data-push="hide" aria-label="×">×</button><b>🔔 ${esc(t('push_h'))}</b><span>${esc(p)}</span><button class="btn dark press" data-push="${act}">${esc(btn)}</button></div>`;
  }
  function renderPushCards(){ $$('.push-slot').forEach(el => { el.innerHTML = pushCardHTML(); }); }
  function pushAction(a){
    if (a === 'on') return enablePush();
    if (a === 'install') return openInstall();
    if (a === 'hide') { LS.set('mh_push_hide', Date.now()); renderPushCards(); }
  }
  function openChatById(id){
    const c = chats.find(x => x.id === id);
    if (c) { openChatId = null; go('chats'); openChatView(c); return; }
    openChatId = id; if (user) loadChats(); else { go('chats'); }
  }
  function stripChatParam(){
    try { const u = new URL(location.href); if (u.searchParams.has('chat') || u.searchParams.has('install')) { u.searchParams.delete('chat'); u.searchParams.delete('install'); history.replaceState(null, '', u.pathname + u.search + u.hash); } } catch(e){}
  }
  if (IS_APP && /[?&]install=1/.test(location.search) && !STANDALONE) setTimeout(openInstall, 1200);
  if (openChatId) { stripChatParam(); setTimeout(() => go('chats'), 50); if (HAS_SB) initAuth(); }
  $('#instBg').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('on'); });
  renderInstall();

  renderChats();
  if (HAS_SB) {
    $('#formBox').hidden = true; $('#cabBox').hidden = false; renderCab();
    let hasSession = false; try { hasSession = !!localStorage.getItem('mh_auth'); } catch(e){}
    if (hasSession || /[?&]code=/.test(location.search)) initAuth();
  }

  /* ---------- load data ---------- */
  function setMasters(list, m){
    MASTERS = list; mode = m;
    $('#demoBadge').hidden = m !== 'demo';
    if (!cities().includes(city)) city = 'ALL';
    renderAll();
    const h = /^#m=(.+)$/.exec(location.hash);
    const id = h ? decodeURIComponent(h[1]) : startId;
    if (id && !openPro && byId(id)) { startId = null; openDetail(id, h ? true : false); }
  }
  async function load(){
    if (!CFG.SHEET_CSV_URL && !HAS_SB) { setMasters(DEMO, 'demo'); return; }
    const cached = LS.get('mh_cache', null);
    const all = () => [...dbMasters, ...csvMasters];
    if (cached && (cached.csv || cached.db)) {
      try { if (CFG.SHEET_CSV_URL && cached.csv) csvMasters = rowsToMasters(parseCSV(cached.csv)); if (HAS_SB && cached.db) dbMasters = cached.db.map(fromDb); setMasters(all(), 'live'); } catch(e){}
    } else renderAll();
    const cache = {...(cached || {})}, jobs = [];
    let fails = 0;
    if (CFG.SHEET_CSV_URL) jobs.push((async () => {
      const url = CFG.SHEET_CSV_URL + (CFG.SHEET_CSV_URL.includes('?') ? '&' : '?') + '_=' + Date.now();
      const res = await fetch(url, {cache:'no-store'});
      if (!res.ok) throw new Error(res.status);
      const csv = await res.text();
      if (/<html/i.test(csv.slice(0, 200))) throw new Error('not csv');
      cache.csv = csv; csvMasters = rowsToMasters(parseCSV(csv));
    })().catch(() => { fails++; }));
    if (HAS_SB) jobs.push(fetchDb().then(rows => { cache.db = rows; dbMasters = rows.map(fromDb); }).catch(() => { fails++; }));
    await Promise.all(jobs);
    if (fails === jobs.length) { if (!cached) { setMasters([], 'live'); toast(t('load_err')); } return; }
    cache.at = Date.now(); LS.set('mh_cache', cache);
    setMasters(all(), 'live');
  }
  function renderLangs(){
    $('#langOpts').innerHTML = LANGS.map(([c, n]) => `<button class="opt" data-lang="${c}"><span>${n}</span>${c === lang ? ICON.check : ''}</button>`).join('');
  }
  function setLang(l){
    if (!I18N[l] || l === lang) return;
    lang = l; LS.set('mh_lang', l); hi = 0; ci = 0; del = false;
    applyStatic(); renderChips(); renderAll(); renderCab(); renderChats();
    if (openPro) openDetail(openPro.id, true);
  }
  applyStatic(); renderChips(); renderAll(); load();
  setTimeout(() => $('#splash').classList.add('go'), 700);
})();
</script>
</body>
</html>
